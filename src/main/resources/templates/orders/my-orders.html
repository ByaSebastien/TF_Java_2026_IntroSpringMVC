<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>Mes commandes</title>
</head>

<body>
<main layout:fragment="content">

    <div class="row mb-4">
        <div class="col">
            <h1 class="mb-3">📋 Mes commandes</h1>
            <p class="text-muted">Retrouvez ici l'historique de vos commandes</p>
        </div>
    </div>

    <!-- Message de succès -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>✓ Succès !</strong> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>✗ Erreur !</strong> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tableau des commandes -->
    <div class="table-responsive" th:if="${not #lists.isEmpty(orders)}">
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>#Commande</th>
                <th>Date</th>
                <th>Montant</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td>
                    <strong th:text="'#' + ${order.orderId()}"></strong>
                </td>
                <td th:text="${#temporals.format(order.createdAt(), 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <strong th:text="'€' + ${#numbers.formatDecimal(order.totalAmount(), 1, 2)}"></strong>
                </td>
                <td>
                    <span th:switch="${order.status().name()}">
                        <span class="badge bg-warning text-dark" th:case="'PENDING'">⏳ En attente</span>
                        <span class="badge bg-success" th:case="'SHIPPED'">✓ Expédiée</span>
                        <span class="badge bg-secondary" th:case="'CANCELLED'">✗ Annulée</span>
                    </span>
                </td>
                <td>
                    <a th:href="@{/orders/{id}(id=${order.orderId()})}" class="btn btn-sm btn-primary">
                        Consulter
                    </a>
                    <form th:if="${order.status().name() == 'PENDING'}" th:action="@{/orders/{id}/cancel(id=${order.orderId()})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Êtes-vous certain d\'annuler cette commande ?')">
                            Annuler
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Aucune commande -->
    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
        <p class="mb-0">
            Vous n'avez pas encore passé de commande. 
            <a th:href="@{/products}">Commencez vos achats →</a>
        </p>
    </div>

    <hr class="my-5">

    <!-- Actions -->
    <div class="d-flex justify-content-between align-items-center">
        <a th:href="@{/products}" class="btn btn-outline-secondary">← Continuer les achats</a>
        <form th:action="@{/orders}" method="post">
            <button type="submit" class="btn btn-lg btn-success">
                📦 Créer une commande
            </button>
        </form>
    </div>

</main>
</body>

</html>
