<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Créer un produit</title>
</head>
<body>
<main layout:fragment="content" class="container my-5">
    <!-- Header -->
    <div class="mb-5">
        <h1 class="display-4 mb-2 text-center">Créer un nouveau produit</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <form th:action="@{/product/create}" method="post" th:object="${product}" novalidate>
                        <!-- Nom -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Nom du produit</label>
                            <input type="text"
                                   id="name"
                                   name="name"
                                   th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="iPhone 15 Pro">
                            <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback d-block">
                                <span th:errors="*{name}"></span>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description"
                                      name="description"
                                      th:field="*{description}"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Décrivez votre produit..."></textarea>
                        </div>

                        <!-- Prix -->
                        <div class="mb-3">
                            <label for="price" class="form-label">Prix (€)</label>
                            <input type="number"
                                   id="price"
                                   name="price"
                                   th:field="*{price}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                   step="0.01"
                                   placeholder="0.00"
                                   min="0">
                            <div th:if="${#fields.hasErrors('price')}" class="invalid-feedback d-block">
                                <span th:errors="*{price}"></span>
                            </div>
                        </div>

                        <!-- Image URL -->
                        <div class="mb-3">
                            <label for="image" class="form-label">URL de l'image</label>
                            <input type="url"
                                   id="image"
                                   name="image"
                                   th:field="*{imageUrl}"
                                   class="form-control"
                                   placeholder="https://example.com/image.jpg">
                        </div>

                        <!-- Catégorie -->
                        <div class="mb-4">
                            <label for="category" class="form-label">Catégorie</label>
                            <select id="category"
                                    name="categoryId"
                                    th:field="*{categoryId}"
                                    class="form-select"
                                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                                <option value="" disabled selected>Sélectionner une catégorie</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('categoryId')}" class="invalid-feedback d-block">
                                <span th:errors="*{categoryId}"></span>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                Créer le produit
                            </button>
                            <a th:href="@{/product}" class="btn btn-outline-secondary">
                                Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
