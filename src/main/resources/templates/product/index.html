<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Catalogue produits</title>
</head>
<body>
<main layout:fragment="content" class="container my-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="display-4">Catalogue Produits</h1>
            <p class="text-muted" th:text="'Total: ' + ${#lists.size(products)} + ' produit(s)'"></p>
        </div>
        <a th:href="@{/product/create}" class="btn btn-success btn-lg">
            <i class="bi bi-plus"></i> Créer nouveau produit
        </a>
    </div>

    <!-- Filtres -->
    <div class="card mb-5 shadow-sm">
        <div class="card-body">
            <form th:action="@{/product}" method="get" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="name" class="form-control" placeholder="🔍 Rechercher par nom...">
                </div>
                <div class="col-md-2">
                    <input type="number" name="minPrice" class="form-control" placeholder="Prix min (€)">
                </div>
                <div class="col-md-2">
                    <input type="number" name="maxPrice" class="form-control" placeholder="Prix max (€)">
                </div>
                <div class="col-md-3">
                    <select name="categoryId" class="form-select">
                        <option value="" selected>📦 Toutes les catégories</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-primary">Filtrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Produits -->
    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info text-center py-5">
        <h5>Aucun produit trouvé</h5>
        <p class="text-muted mb-0">Essayez de modifier vos critères de recherche</p>
    </div>

    <div th:if="${!#lists.isEmpty(products)}" class="row g-4">
        <div th:each="p : ${products}" class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm hover-card">
                <!-- Image -->
                <div class="card-img-top overflow-hidden" style="height: 250px;">
                    <img th:src="${p.imageUrl}" alt="Product" class="w-100 h-100 object-fit-cover">
                </div>

                <div class="card-body d-flex flex-column">
                    <!-- Catégorie -->
                    <span class="badge bg-info mb-2 align-self-start" th:text="${p.category.name}"></span>

                    <!-- Nom -->
                    <h5 class="card-title" th:text="${p.name}"></h5>

                    <!-- Description -->
                    <p class="card-text text-muted small"
                       th:text="${#strings.length(p.description) > 100 ? #strings.substring(p.description, 0, 100) + '...' : p.description}"></p>

                    <!-- Spacer -->
                    <div class="mt-auto">
                        <!-- Prix -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="h5 mb-0 text-success"
                                  th:text="'€' + ${#numbers.formatDecimal(p.price, 1, 2)}"></span>
                        </div>

                        <!-- Bouton -->
                        <a th:href="@{/product/{id}(id=${p.id})}" class="btn btn-outline-primary w-100">
                            Voir détails →
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
